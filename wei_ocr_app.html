<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Đọc 12 số sau WEI</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@6/dist/tesseract.min.js"></script>
  <style>
    :root { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
    body { margin: 0; background:#f5f7fb; color:#162033; }
    main { max-width: 900px; margin: 24px auto; padding: 16px; }
    .card { background:#fff; border-radius:16px; padding:18px; box-shadow:0 8px 28px rgba(0,0,0,.08); margin-bottom:16px; }
    h1 { margin:0 0 10px; font-size:24px; }
    p { margin:6px 0 14px; color:#526079; }
    input[type=file] { width:100%; padding:12px; border:1px dashed #aab4c8; border-radius:12px; }
    .grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; margin-top:14px; }
    label { font-size:13px; color:#526079; }
    input[type=range] { width:100%; }
    button { border:0; border-radius:12px; padding:12px 16px; font-weight:700; cursor:pointer; }
    #run { background:#1264e8; color:white; }
    #copy { background:#e8eef9; color:#16325c; }
    #status { margin-top:12px; font-weight:600; }
    .result { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:14px; }
    textarea { width:100%; min-height:360px; box-sizing:border-box; border:1px solid #d6dce8; border-radius:12px; padding:12px; font:18px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace; }
    canvas { max-width:100%; border-radius:10px; border:1px solid #d6dce8; }
    .small { font-size:12px; color:#73809a; }
    @media(max-width:700px){ .grid,.result{grid-template-columns:1fr;} }
  </style>
</head>
<body>
<main>
  <section class="card">
    <h1>Đọc 12 số trong cột WEI</h1>
    <p>Chọn nhiều ảnh. Ứng dụng chỉ OCR vùng cột WEI, loại số 0 và trả kết quả theo chiều dọc.</p>
    <input id="files" type="file" accept="image/*" multiple />

    <div class="grid">
      <div><label>Vị trí trái vùng WEI: <b id="leftV">27%</b></label><input id="left" type="range" min="0" max="80" value="27"></div>
      <div><label>Vị trí trên: <b id="topV">18%</b></label><input id="top" type="range" min="0" max="80" value="18"></div>
      <div><label>Chiều rộng vùng: <b id="widthV">21%</b></label><input id="width" type="range" min="5" max="60" value="21"></div>
      <div><label>Chiều cao vùng: <b id="heightV">68%</b></label><input id="height" type="range" min="10" max="82" value="68"></div>
    </div>
    <p class="small">Các tỷ lệ mặc định đã căn gần đúng theo ảnh mẫu. Nếu ảnh chụp khác góc, chỉnh vùng để chỉ bao quanh dãy số dưới chữ WEI.</p>
    <button id="run">Đọc dữ liệu</button>
    <button id="copy">Sao chép kết quả</button>
    <div id="status"></div>
  </section>

  <section class="card result">
    <div>
      <h3>Vùng OCR xem trước</h3>
      <canvas id="preview"></canvas>
    </div>
    <div>
      <h3>Kết quả</h3>
      <textarea id="output" placeholder="Mỗi số một dòng..."></textarea>
    </div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
['left','top','width','height'].forEach(id => {
  $(id).addEventListener('input', () => $(id+'V').textContent = $(id).value + '%');
});

function loadImage(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = URL.createObjectURL(file);
  });
}

function cropAndEnhance(img) {
  const l = +$('left').value / 100, t = +$('top').value / 100;
  const w = +$('width').value / 100, h = +$('height').value / 100;
  const sx = Math.round(img.naturalWidth*l), sy = Math.round(img.naturalHeight*t);
  const sw = Math.round(img.naturalWidth*w), sh = Math.round(img.naturalHeight*h);

  const scale = 2;
  const c = document.createElement('canvas');
  c.width = sw*scale; c.height = sh*scale;
  const ctx = c.getContext('2d', {willReadFrequently:true});
  ctx.drawImage(img, sx, sy, sw, sh, 0, 0, c.width, c.height);

  const im = ctx.getImageData(0,0,c.width,c.height);
  const d = im.data;
  for(let i=0;i<d.length;i+=4){
    const g = 0.299*d[i] + 0.587*d[i+1] + 0.114*d[i+2];
    // Tăng tương phản, giữ chữ sáng trên nền tối
    const v = g > 105 ? 255 : 0;
    d[i]=d[i+1]=d[i+2]=v;
  }
  ctx.putImageData(im,0,0);
  return c;
}

function extractNumbers(text) {
  return (text.match(/\d+/g) || [])
    .map(s => Number(s))
    .filter(n => Number.isFinite(n) && n !== 0 && n >= 100)
    .slice(0, 12);
}

$('run').addEventListener('click', async () => {
  const files = [...$('files').files];
  if(!files.length){ $('status').textContent='Hãy chọn ít nhất một ảnh.'; return; }
  $('run').disabled = true;
  $('output').value = '';
  const all = [];

  try {
    $('status').textContent='Đang tải bộ OCR...';
    const worker = await Tesseract.createWorker('eng', 1, {
      logger: m => {
        if(m.status === 'recognizing text') $('status').textContent = `Đang OCR: ${Math.round((m.progress||0)*100)}%`;
      }
    });
    await worker.setParameters({
      tessedit_char_whitelist: '0123456789',
      tessedit_pageseg_mode: '6',
      preserve_interword_spaces: '1'
    });

    for(let i=0;i<files.length;i++){
      $('status').textContent=`Đang xử lý ảnh ${i+1}/${files.length}...`;
      const img = await loadImage(files[i]);
      const crop = cropAndEnhance(img);

      if(i===0){
        const p=$('preview'); p.width=crop.width; p.height=crop.height;
        p.getContext('2d').drawImage(crop,0,0);
      }

      const { data:{ text } } = await worker.recognize(crop);
      const nums = extractNumbers(text);
      all.push({name:files[i].name, nums});
    }
    await worker.terminate();

    $('output').value = all.map((x,idx) =>
      files.length === 1
        ? x.nums.join('\n')
        : `Ảnh ${idx+1}: ${x.name}\n${x.nums.join('\n')}`
    ).join('\n\n');

    const total = all.reduce((s,x)=>s+x.nums.length,0);
    $('status').textContent=`Hoàn tất: ${files.length} ảnh, lấy được ${total} số.`;
  } catch(err){
    console.error(err);
    $('status').textContent='Có lỗi OCR: ' + (err.message || err);
  } finally {
    $('run').disabled = false;
  }
});

$('copy').addEventListener('click', async () => {
  await navigator.clipboard.writeText($('output').value || '');
  $('status').textContent='Đã sao chép.';
});
</script>
</body>
</html>
